name: Release Android TV APK

# **只允许手动触发**：推送到 main 不再自动打包发布。
#
# 为什么改成手动：发布是「对外发版」这个动作，不应该由一次普通推送顺带完成；
# 什么时候发、发哪个版本，由维护者在 Actions 页面点一次 Run workflow 决定。
#
# 手动触发时把本次的 versionName / versionCode 与**上一次发布的 tag**比较：
#   两个都**严格大于**基准 → 打包并发布 Release（tag = v<版本号>）
#   两个都与基准相同      → 跳过，不打包
#   其余（只升一个 / 降了）→ 失败，提示版本必须同时增大
# 基准取自 HEAD 上最近的 `v*` tag；一个都没有时回落到上一个提交。
# 比对规则在 tools/compare-version.sh，本地可单独跑（用法见该脚本头部）。
# 可选 force=true，跳过比对直接发布当前版本（补发失败 Release 用）。
on:
  workflow_dispatch:
    inputs:
      force:
        description: 跳过版本比对，直接打包并发布当前版本（用于补发失败的 Release）
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  version:
    name: 检查版本号
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
      version: ${{ steps.current.outputs.version }}
      code: ${{ steps.current.outputs.code }}
      apk: ${{ steps.current.outputs.apk }}
      tag: ${{ steps.current.outputs.tag }}
      min_sdk: ${{ steps.current.outputs.min_sdk }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0            # 需要完整历史来定位上一次发布的 tag
          fetch-tags: true          # 基准取自发布 tag，必须把 tag 拉下来

      - name: 手动强制发布
        id: forced
        if: github.event_name == 'workflow_dispatch' && inputs.force
        run: echo "force=true，跳过版本比对。"

      - name: 读取当前版本
        id: current
        run: |
          set -euo pipefail
          version="$(tools/version.sh version)"
          code="$(tools/version.sh code)"
          apk="$(tools/version.sh apk)"
          min_sdk="$(tools/version.sh min-sdk)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "code=$code"       >> "$GITHUB_OUTPUT"
          echo "apk=$apk"         >> "$GITHUB_OUTPUT"
          echo "tag=v$version"    >> "$GITHUB_OUTPUT"
          echo "min_sdk=$min_sdk" >> "$GITHUB_OUTPUT"
          echo "本次提交：versionName=$version versionCode=$code minSdk=$min_sdk 产物=$apk"

      - name: 与上一次发布对比
        id: diff
        env:
          GRADLE_FILE: android/app/build.gradle.kts
        run: |
          set -euo pipefail
          if [ "${{ inputs.force }}" = "true" ]; then
            echo "force=true，视为版本已变动。"
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # 基准 = **上一次发布的 tag**（HEAD 上最近的 `v*`），不是「上一个提交」：
          # 版本是相对「上一个正式版」升的，跟中间夹了多少次不升版本的普通推送无关。
          # 删除历史 tag 后基线会自然重算（例如只留 v1.0.0 时，下一次就是相对 v1.0.0 比）。
          # 用 --tags 才认轻量 tag（本仓库的发布 tag 都是轻量的）。
          # 不做「本次 tag 已存在就退到它父提交」的特殊处理：那种情况（补发同一版本）
          # 走 workflow_dispatch 的 force=true；这里若退到父提交，反而会把基准挪到
          # 更早的版本上，导致「已经发过的版本」被判成需要再发一次。
          previous="$(git describe --tags --abbrev=0 --match 'v[0-9]*' HEAD 2>/dev/null || true)"
          if [ -z "$previous" ]; then
            # 一个发布 tag 都没有：回落到 HEAD~1。手动触发没有「上一次推送」这个概念，
            # 因此不再读 BEFORE_SHA。
            if git rev-parse --verify -q HEAD~1 >/dev/null; then
              previous="$(git rev-parse HEAD~1)"
              echo "没有发布 tag，回落到 HEAD~1 作为基准。"
            fi
          fi
          if [ -z "$previous" ]; then
            echo "没有可比对的历史（仓库首个提交），视为版本已变动。"
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "比对基准：$previous（$(git describe --tags --always "$previous" 2>/dev/null || echo "$previous")）"

          # 这个文件在历史里换过位置（早期在 kotlin-tv/ 下），逐个候选路径找出来
          old_file=""
          for candidate in "$GRADLE_FILE" "kotlin-tv/app/build.gradle.kts"; do
            if git cat-file -e "${previous}:${candidate}" 2>/dev/null; then old_file="$candidate"; break; fi
          done
          if [ -z "$old_file" ]; then
            echo "基准提交里没有找到 build.gradle.kts，视为版本已变动。"
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "基准文件：$old_file"
          git show "${previous}:${old_file}" > /tmp/previous-build.gradle.kts
          export HGTV_GRADLE_FILE=/tmp/previous-build.gradle.kts
          old_version="$(tools/version.sh version)"
          old_code="$(tools/version.sh code)"
          new_version="${{ steps.current.outputs.version }}"
          new_code="${{ steps.current.outputs.code }}"
          echo "基准版本：versionName=${old_version} versionCode=${old_code}"

          # 只有两个都**严格大于**基准才发布；判定逻辑收在 tools/compare-version.sh，
          # 本地可单独跑同一份规则（避免 CI 与本地各写一套比较）。
          # 工具在参数异常时以非零退出（set -e 会直接中断且看不出原因），这里显式接住。
          decision="$(tools/compare-version.sh "$old_version" "$old_code" "$new_version" "$new_code" | tail -1)" || decision=""
          [ -n "$decision" ] || { echo "::error::版本比对失败，请检查 tools/compare-version.sh 的输出"; exit 1; }
          case "$decision" in
            release)
              echo "changed=true" >> "$GITHUB_OUTPUT"
              ;;
            skip)
              echo "changed=false" >> "$GITHUB_OUTPUT"
              echo "版本未变动，跳过打包与发布。"
              ;;
            *)
              echo "::error::版本必须同时大于基准才发布（versionName ${old_version} → ${new_version}、versionCode ${old_code} → ${new_code}）"
              exit 1
              ;;
          esac

  release:
    name: 打包并发布
    needs: version
    if: needs.version.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write        # 创建 Release
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools

      - name: 安装 Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: 恢复发布签名密钥
        env:
          KEYSTORE_BASE64: ${{ secrets.HGTV_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64" || { echo "::error::缺少 secrets.HGTV_KEYSTORE_BASE64"; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          {
            echo "storeFile=$RUNNER_TEMP/release.jks"
            echo "storePassword=${{ secrets.HGTV_STORE_PASSWORD }}"
            echo "keyAlias=${{ secrets.HGTV_KEY_ALIAS }}"
            echo "keyPassword=${{ secrets.HGTV_KEY_PASSWORD }}"
          } > android/keystore.properties
          echo "签名配置已写入 android/keystore.properties"

      - name: 单元测试、lint、构建正式包
        run: ./android/gradlew -p android :core:test :app:lintRelease :app:assembleRelease --console=plain

      - name: 命名产物并计算校验和
        id: apk
        run: |
          set -euo pipefail
          apk="${{ needs.version.outputs.apk }}"
          cp android/app/build/outputs/apk/release/app-release.apk "$apk"
          sha256sum "$apk" | tee SHA256SUMS
          echo "name=$apk" >> "$GITHUB_OUTPUT"

      - name: 生成应用内更新的元数据
        env:
          VERSION: ${{ needs.version.outputs.version }}
          CODE: ${{ needs.version.outputs.code }}
          MIN_SDK: ${{ needs.version.outputs.min_sdk }}
          TAG: ${{ needs.version.outputs.tag }}
          APK: ${{ needs.version.outputs.apk }}
        run: |
          set -euo pipefail
          # 客户端弹窗显示的文案与 Release 正文同源：都取自 docs/CHANGELOG.md 当前版本那一节，
          # 只是 notes 用纯文字短版（剥掉 Markdown、长度封顶）。
          NOTES="$(HGTV_VERSION="$VERSION" tools/release-notes.sh notes)"
          export NOTES
          size="$(wc -c < "$APK" | tr -d ' ')"
          sha="$(sha256sum "$APK" | cut -d' ' -f1)"
          # update.json 是客户端「检查更新」读的唯一文件，字段与 AppUpdate.parse 一一对应。
          python3 - "$VERSION" "$CODE" "$MIN_SDK" "$TAG" "$APK" "$size" "$sha" "$NOTES" > update.json <<'PY'
          import json, sys
          version, code, min_sdk, tag, apk, size, sha, notes = sys.argv[1:9]
          print(json.dumps({
              "schema": 1,
              "packageName": "com.hgtv.star",
              "versionName": version,
              "versionCode": int(code),
              "minSdk": int(min_sdk),
              "tag": tag,
              "notes": notes.strip(),
              "apk": {"name": apk, "size": int(size), "sha256": sha},
          }, ensure_ascii=False, indent=2))
          PY
          cat update.json

      # 这里原先还有一步 `:core:test --tests 'com.hgtv.star.core.AppUpdatesTest'`，
      # 而 `AppUpdates` 类早已随「应用内更新入口」一起从代码里删除——Gradle 的 `--tests`
      # 过滤无命中会直接失败（`No tests found for given includes`），于是整条发布流水线
      # 卡在 `gh release create` 之前，每次都得手工补发 Release。
      #
      # 校验本身是有价值的（字段名、正则、校验值格式），因此保留 Python 那一段，
      # 只去掉那个指向不存在类的测试调用。
      - name: 校验元数据格式
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, re
          meta = json.load(open("update.json", encoding="utf-8"))
          assert meta["schema"] == 1, "schema 必须是 1"
          assert meta["packageName"] == "com.hgtv.star", "包名不对"
          assert re.fullmatch(r"[0-9][0-9A-Za-z.+-]{0,63}", meta["versionName"]), "版本名不符合规则"
          assert re.fullmatch(r"v[0-9][0-9A-Za-z.+-]{0,80}", meta["tag"]), "tag 不符合规则"
          assert re.fullmatch(r"HGTV_[0-9][0-9A-Za-z.+-]{0,80}\.apk", meta["apk"]["name"]), "安装包名不符合规则"
          assert re.fullmatch(r"[0-9a-f]{64}", meta["apk"]["sha256"]), "校验值不符合规则"
          print("update.json 校验通过：", meta["versionName"], meta["versionCode"], meta["apk"]["name"])
          PY

      - name: 上传构建产物
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ needs.version.outputs.apk }}
          path: |
            ${{ needs.version.outputs.apk }}
            SHA256SUMS
            update.json

      - name: 写发布说明
        # 正文直接取自 docs/CHANGELOG.md 里当前版本那一节（`## <版本号>：...`），
        # 不在这里另写一套模板：改了 CHANGELOG 就等于改了发布说明，两边不会再对不上。
        # 找不到对应版本条目时该步骤失败，避免发出一份空说明。
        env:
          HGTV_VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          tools/release-notes.sh body > RELEASE_NOTES.md
          echo "发布说明已生成（${{ needs.version.outputs.version }}）："
          cat RELEASE_NOTES.md

      - name: 发布 Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
          APK: ${{ needs.version.outputs.apk }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::Release $TAG 已存在，请再升一次版本号"
            exit 1
          fi
          gh release create "$TAG" "$APK" SHA256SUMS update.json \
            --title "$TAG" \
            --notes-file RELEASE_NOTES.md
