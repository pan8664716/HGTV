<style>
  *{box-sizing:border-box}
  :root{

  html,body{margin:0}
  body{

  .head{max-width:660px;margin:0 auto 56px;text-align:center}

  }
  .head h1{font-size:29px;line-height:1.3;font-weight:700;letter-spacing:-.5px;margin:0 0 10px}
  .head p{margin:0;font-size:14px;color:var(--muted)}
  .grid{display:flex;flex-wrap:wrap;justify-content:center;gap:54px 44px;max-width:1520px;margin:0 auto}
  .phone-wrap{width:330px;flex:0 0 auto;margin:0;display:flex;flex-direction:column;align-items:center;gap:16px}
  .cap{text-align:center;display:flex;flex-direction:column;gap:3px}
  .cap b{font-size:14.5px;font-weight:700;color:var(--text)}

  .phone{
    position:relative;width:330px;height:714px;padding:10px;border-radius:46px;
    background:linear-gradient(165deg,#2a313d 0%,#1b2028 50%,#262d39 100%);
    box-shadow:0 0 0 1px rgba(255,255,255,.06),0 38px 72px -30px rgba(0,0,0,.95),0 12px 28px -14px rgba(0,0,0,.8);
  }
  .phone::after{
    content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;pointer-events:none;
    background:linear-gradient(160deg,rgba(255,255,255,.15),rgba(255,255,255,.02) 44%,rgba(255,255,255,.06));
    -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
    -webkit-mask-composite:xor;mask-composite:exclude;
  }
  .island{
    position:absolute;top:18px;left:50%;transform:translateX(-50%);
    width:86px;height:23px;border-radius:99px;background:#0a0d12;z-index:3;
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.04);
  }
  .screen{position:relative;width:100%;height:100%;border:0;border-radius:37px;background:var(--bg);display:block}
</style>
