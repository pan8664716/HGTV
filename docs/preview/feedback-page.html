<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>问题反馈 · 页面预览</title>
<style>
  :root {
    --bg:#1e2228; --surface:#262c33; --high:#2b323a; --well:#171b20; --wellDeep:#14171c;
    --text:#f2f5f8; --sub:#aab4c0; --muted:#8b95a2;
    --sd:#12151a; --sl:#2a3038; --focus:#4da3ff;
  }
  * { box-sizing:border-box; }
  body { margin:0; background:#0d1014; font-family:-apple-system,"PingFang SC","Noto Sans CJK SC",sans-serif; }
  .tv { position:relative; width:1280px; height:720px; background:var(--bg); overflow:hidden;
        padding:12px 78px; display:flex; flex-direction:column; }
  .toolbar { height:88px; display:flex; align-items:center; gap:8px; }
  .brand { font-size:30px; font-weight:700; color:#f2f5f8; margin-right:auto; letter-spacing:1px; }
  .nav { width:60px; height:60px; border-radius:50%; background:var(--surface);
          box-shadow:7px 7px 16px var(--sd), -6px -6px 15px var(--sl); display:flex; align-items:center;
          justify-content:center; color:#f2f5f8; }
  .nav.active { background:var(--high); box-shadow:8px 8px 18px var(--sd), -7px -7px 17px var(--sl); }
  .nav svg { width:24px; height:24px; fill:currentColor; }
  .body { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; }
  .lead { font-size:14px; color:var(--muted); margin-bottom:16px; }
  .cards { display:flex; gap:28px; }
  .card { width:354px; padding:36px; border-radius:32px; background:var(--high);
          box-shadow:20px 20px 44px var(--sd), -14px -14px 36px var(--sl);
          display:flex; flex-direction:column; align-items:center; }
  .badge { width:92px; height:92px; border-radius:50%; background:var(--wellDeep);
           box-shadow:inset 7px 7px 14px #0c0f13, inset -6px -6px 13px #2b333f;
           display:flex; align-items:center; justify-content:center; }
  .glyph svg { width:34px; height:34px; fill:currentColor; display:block; }
  .well { width:250px; height:250px; margin-top:16px; border-radius:32px; background:var(--well);
          box-shadow:inset 8px 8px 17px #0b0e12, inset -7px -7px 16px #262e38;
          padding:18px; display:flex; align-items:center; justify-content:center; }
  .well svg { width:100%; height:100%; display:block; }
  .name { margin-top:12px; font-size:20px; font-weight:700; color:var(--text); }
  .detail { margin-top:3px; font-size:13px; color:var(--muted); }
</style></head>
