<!DOCTYPE html>
<html lang="zh-CN" data-theme="haze-blue">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>红果TV · 手机版交互原型</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --base:#E0E5EC; --light:#FFFFFF; --dark:#A3B1C6;
  --surface:#EDF1F6; --surfaceHigh:#F4F7FA; --well:#D3DAE4; --wellDeep:#C6CFDB;
  --text:#3A4553; --sub:#6B7788; --textDim:#55616F; --textStrong:#333D4A;
  --focus:#4A7DFF; --accent:#5B8DEF; --danger:#E5484D;
  --lit:#FFFFFF; --onLit:#242A32;
  --focusRing:rgba(74,125,255,.85); --litGlow:rgba(74,125,255,.22);
  --outline:rgba(58,69,83,.10); --separator:rgba(58,69,83,.08);
  --shDark:rgba(163,177,198,.55); --shLight:rgba(255,255,255,.95);
  --inDark:rgba(163,177,198,.55); --inLight:rgba(255,255,255,.9);
  --raised:-5px -5px 11px var(--shLight), 5px 5px 11px var(--shDark);
  --raised-sm:-3px -3px 7px var(--shLight), 3px 3px 7px var(--shDark);
  --pressed:inset 3px 3px 6px var(--inDark), inset -3px -3px 6px var(--inLight);
  --float:-8px -8px 18px var(--shLight), 9px 9px 20px var(--shDark);
}
html,body{min-height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  color:#E9EEF4;padding-bottom:40px;
  background:radial-gradient(120% 80% at 50% -10%,#2b323a 0%,#1b1f25 46%,#12151a 100%) fixed;
}
button{font-family:inherit;color:inherit;border:0;background:none;cursor:pointer;-webkit-tap-highlight-color:transparent}
::-webkit-scrollbar{width:7px;height:7px}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.14);border-radius:7px}
::-webkit-scrollbar-track{background:transparent}

/* ---------- 页头 ---------- */
.mast{max-width:1560px;margin:0 auto;padding:28px 40px 12px;display:flex;justify-content:space-between;align-items:flex-start;gap:26px;flex-wrap:wrap}
.brand{display:flex;gap:15px;align-items:center}
.mark{width:52px;height:52px;border-radius:16px;background:linear-gradient(145deg,#f2f5f9,#cfd7e2);color:#3A4553;display:grid;place-items:center;font-size:23px;font-weight:800;box-shadow:-4px -4px 10px rgba(255,255,255,.12),6px 6px 14px rgba(0,0,0,.45)}
.eyebrow{font-size:10px;letter-spacing:2.2px;color:#7E8A98;font-weight:700;margin-bottom:5px}
.mast h1{font-size:22px;font-weight:800;letter-spacing:-.4px}
.mast .sub{font-size:12.5px;color:#8E9AA8;margin-top:6px;line-height:1.7;max-width:760px}
.mast .sub b{color:#C9D4E0}
.mast-right{display:flex;flex-direction:column;gap:9px;align-items:flex-end}
.seg{display:flex;gap:4px;padding:5px;border-radius:999px;background:#232930;box-shadow:inset 3px 3px 7px rgba(0,0,0,.5),inset -3px -3px 7px rgba(255,255,255,.04)}
.seg button{font-size:12px;font-weight:700;color:#8E9AA8;padding:8px 16px;border-radius:999px}
.seg button.on{background:#2E343B;color:#EAF1F8;box-shadow:-2px -2px 6px rgba(255,255,255,.06),3px 3px 8px rgba(0,0,0,.45)}
.hint{font-size:10.5px;color:#6E7A88}

/* ---------- 令牌条 ---------- */
.specs{max-width:1560px;margin:0 auto;padding:4px 40px 0;display:flex;gap:10px;flex-wrap:wrap}
.spec{flex:1 1 170px;min-width:150px;background:#22272E;border-radius:14px;padding:10px 12px;display:flex;gap:10px;align-items:center;box-shadow:-3px -3px 8px rgba(255,255,255,.03),4px 4px 10px rgba(0,0,0,.35)}
.spec .sw{width:28px;height:28px;border-radius:9px;flex:none;box-shadow:inset 0 0 0 1px rgba(255,255,255,.1)}
.spec b{display:block;font-size:11px;font-weight:800;margin-bottom:2px}
.spec span{font-size:9.5px;color:#8B97A5}

/* ---------- 流程 ---------- */
.flow{max-width:1560px;margin:0 auto;padding:6px 40px 40px}
.plat-head{display:flex;align-items:center;gap:12px;margin:30px 0 0;padding-bottom:11px;border-bottom:1px solid rgba(255,255,255,.08);flex-wrap:wrap}
.plat-head h2{font-size:18px;font-weight:800}
.plat-head .tag{font-size:9.5px;font-weight:800;letter-spacing:1px;color:#9EC7FF;background:rgba(77,163,255,.12);padding:4px 9px;border-radius:999px}
.plat-head .meta{font-size:10.5px;color:#8B97A5;margin-left:auto}
.plat-note{font-size:12px;color:#93A0AE;margin-top:9px;line-height:1.75}
.plat-note b{color:#D3DEEA}
.stage{margin-top:22px}
.stage-h{display:flex;align-items:center;gap:11px;margin-bottom:11px}
.stage-h .n{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;font-size:11px;font-weight:800;color:#9EC7FF;box-shadow:inset 2px 2px 5px rgba(0,0,0,.5),inset -2px -2px 5px rgba(255,255,255,.04);flex:none}
.stage-h h3{font-size:14px;font-weight:800}
.stage-h p{font-size:11.5px;color:#8B97A5}
.rail{display:flex;align-items:flex-start;overflow-x:auto;padding:4px 2px 16px}
.slot{flex:none;display:flex;flex-direction:column;gap:8px}
.frame-box{position:relative;cursor:pointer;border-radius:26px;transition:transform .2s}
.frame-box:hover{transform:translateY(-3px)}
.frame-box .scale{overflow:hidden;border-radius:26px;background:#0d1117;box-shadow:0 10px 26px rgba(0,0,0,.45),inset 0 0 0 4px #1b2028,inset 0 0 0 5px rgba(255,255,255,.08)}
.cap{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.cap .sid{font-size:9px;font-weight:800;letter-spacing:.5px;color:#9EC7FF;background:rgba(77,163,255,.1);border-radius:5px;padding:2px 5px;flex:none}
.cap b{font-size:11.5px;font-weight:800;color:#E4EBF3}
.cap em{font-size:10px;color:#7E8B99;font-style:normal;width:100%;line-height:1.45}
.arrow{flex:none;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:6px;color:#5C6875}
.arrow .ln{width:22px;height:1px;background:currentColor;position:relative}
.arrow .ln::after{content:'';position:absolute;right:0;top:-2.5px;width:5px;height:5px;border-top:1px solid currentColor;border-right:1px solid currentColor;transform:rotate(45deg)}
.arrow span{font-size:9.5px;width:42px;text-align:center;line-height:1.35;color:#9AA6B4}

/* ---------- 手机外壳 ---------- */
.device{position:relative;flex:none;padding:9px;border-radius:54px;background:linear-gradient(155deg,#4a5262,#20252e 55%,#2c323d);box-shadow:0 26px 50px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.28)}
.device::before{content:'';position:absolute;right:-2.5px;top:170px;width:3px;height:56px;border-radius:3px;background:#2a303b}
.device::after{content:'';position:absolute;left:-2.5px;top:150px;width:3px;height:34px;border-radius:3px;background:#2a303b;box-shadow:0 44px 0 #2a303b}
.device.ios{border-radius:58px}
.screen{position:relative;width:392px;height:856px;border-radius:46px;overflow:hidden;background:var(--base);color:var(--text);font-family:inherit}
.screen.ios{width:390px;height:844px;border-radius:49px}
.screen.android{--sb:44px;--nav:26px;--tab:76px}
.screen.ios{--sb:54px;--nav:22px;--tab:72px}
.screen.dark{background:#07090d}
.screen *{scrollbar-width:none}
.screen *::-webkit-scrollbar{display:none}

.statusbar{position:absolute;top:0;left:0;right:0;height:var(--sb);z-index:60;display:flex;align-items:center;justify-content:space-between;padding:0 24px;pointer-events:none;color:var(--text)}
.screen.dark .statusbar{color:#fff}
.screen.ios .statusbar{padding:0 28px 8px;align-items:flex-end}
.statusbar .time{font-size:13px;font-weight:800;letter-spacing:.2px}
.screen.ios .statusbar .time{font-size:15px;font-weight:600;letter-spacing:-.2px}
.statusbar .right{display:flex;align-items:center;gap:6px}
.sig{display:flex;align-items:flex-end;gap:2px;height:10px}
.sig i{width:3px;background:currentColor;border-radius:1px;display:block}
.sig i:nth-child(1){height:4px}.sig i:nth-child(2){height:6px}.sig i:nth-child(3){height:8px}.sig i:nth-child(4){height:10px}
.batt{width:21px;height:10px;border:1.3px solid currentColor;border-radius:3px;padding:1.5px;opacity:.8}
.batt i{display:block;height:100%;width:74%;background:currentColor;border-radius:1.5px}
.island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:118px;height:34px;border-radius:19px;background:#08080c}
.punch{position:absolute;top:14px;left:50%;transform:translateX(-50%);width:10px;height:10px;border-radius:50%;background:#0b0d12}
.sysbar{position:absolute;left:0;right:0;bottom:0;height:var(--nav);z-index:58;display:grid;place-items:center;pointer-events:none}
.sysbar .pill{width:112px;height:4px;border-radius:3px;background:rgba(58,69,83,.35)}
.screen.dark .sysbar .pill{background:rgba(255,255,255,.85)}
.screen.ios .sysbar .pill{width:132px;height:5px;background:rgba(20,22,26,.8)}
.screen.dark.ios .sysbar .pill{background:rgba(255,255,255,.95)}

/* 应用层 */
.app{position:absolute;inset:0;display:flex;flex-direction:column;padding-top:var(--sb)}
.body{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding-bottom:calc(var(--tab) + var(--nav) + 6px)}
.body.noTab{padding-bottom:calc(var(--nav) + 10px)}
.body.flush{padding-bottom:0}

/* 应用栏 */
.appbar{flex:none;display:flex;align-items:center;gap:10px;padding:4px 16px 10px;min-height:52px}
.appbar .ttl{font-size:24px;font-weight:800;letter-spacing:-.5px}
.screen.ios .appbar .ttl{font-size:23px}
.appbar .sub{font-size:11px;color:var(--sub);margin-top:1px}
.appbar .space{flex:1}
.appbar .acts{display:flex;gap:8px;flex:none}
.circle{width:40px;height:40px;border-radius:50%;background:var(--surface);box-shadow:var(--raised);display:grid;place-items:center;color:var(--textDim);flex:none}
.circle:active{box-shadow:var(--pressed)}
.circle.on{color:var(--text);box-shadow:var(--raised),0 0 0 2px var(--focusRing)}
.circle svg{width:19px;height:19px}

/* 底部五栏 */
.tabscrim{position:absolute;left:0;right:0;bottom:0;height:calc(var(--tab) + var(--nav) + 26px);z-index:54;pointer-events:none;background:linear-gradient(to top,var(--base) calc(var(--tab) + var(--nav) + 4px),transparent)}
.tabscrim::after{content:'';position:absolute;left:0;right:0;bottom:0;height:calc(var(--tab) + var(--nav) + 4px);background:var(--base)}
.tabbar{position:absolute;left:12px;right:12px;bottom:calc(var(--nav) + 6px);height:var(--tab);z-index:55;display:flex;align-items:center;padding:0 6px;border-radius:999px;background:var(--base);box-shadow:var(--raised)}
.screen.ios .tabbar{height:66px;bottom:calc(var(--nav) + 4px)}
.tab{flex:1;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border-radius:999px;color:var(--sub);font-size:9.5px;font-weight:600;letter-spacing:.2px}
.tab svg{width:21px;height:21px}
.tab.on{color:var(--text);box-shadow:var(--pressed);font-weight:800}
.tab:active{transform:scale(.95)}

/* 通用 */
.chip{height:34px;padding:0 14px;border-radius:999px;background:var(--surface);box-shadow:var(--raised-sm);color:var(--textDim);font-size:12.5px;font-weight:700;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;flex:none}
.chip.on{background:var(--well);box-shadow:var(--pressed),0 0 0 2px var(--focusRing);color:var(--text)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 16px 10px}
.btn{height:42px;padding:0 18px;border-radius:999px;background:var(--surface);box-shadow:var(--raised);color:var(--textDim);font-size:13.5px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
.btn:active{box-shadow:var(--pressed)}
.btn.lit{background:var(--lit);color:var(--onLit);box-shadow:0 0 0 2px var(--focusRing),0 6px 16px var(--litGlow)}
.btn.sm{height:34px;padding:0 13px;font-size:12px}
.btn.block{width:100%}
.card{background:var(--surface);border-radius:20px;box-shadow:var(--raised);padding:14px}
.hr{height:1px;background:var(--separator);margin:0}
.row{display:flex;align-items:center;gap:10px}
.muted{color:var(--sub)}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;padding:4px 18px 8px}
.sec-h h3{font-size:15.5px;font-weight:800;letter-spacing:-.2px}
.sec-h span{font-size:10.5px;color:var(--sub)}

/* 首页剧架 */
.shelf{padding:0 0 12px}
.shelf-head{display:flex;align-items:baseline;gap:8px;padding:2px 18px 7px}
.shelf-head h3{font-size:16px;font-weight:800}
.shelf-head span{font-size:10px;color:var(--sub)}
.shelf-row{display:flex;gap:10px;overflow-x:auto;padding:2px 18px 6px}
.pcard{flex:none;width:112px}
.pcard .poster{position:relative;width:112px;height:149px;border-radius:14px;overflow:hidden;background:linear-gradient(160deg,var(--c1),var(--c2));box-shadow:var(--raised-sm)}
.pcard .poster::after{content:'';position:absolute;inset:0;background:radial-gradient(72% 52% at 28% 16%,rgba(255,255,255,.28),transparent 62%),linear-gradient(to top,rgba(8,10,16,.72),transparent 55%)}
.pcard .rk{position:absolute;left:6px;top:6px;z-index:2;font-size:10px;font-weight:800;color:#fff;background:rgba(0,0,0,.42);backdrop-filter:blur(4px);padding:2px 6px;border-radius:6px}
.pcard .rk.top{background:var(--accent);color:#fff}
.pcard .epb{position:absolute;right:6px;bottom:6px;z-index:2;font-size:9px;font-weight:700;color:#fff;background:rgba(0,0,0,.45);padding:2px 5px;border-radius:5px}
.pcard .pt{position:absolute;left:7px;right:7px;bottom:22px;z-index:2;color:#fff;font-size:10.5px;font-weight:700;line-height:1.3;text-shadow:0 1px 5px rgba(0,0,0,.6);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pcard .prog{position:absolute;left:0;right:0;bottom:0;height:3px;background:rgba(255,255,255,.2);z-index:2}
.pcard .prog i{display:block;height:100%;background:var(--accent)}
.pcard .nm{font-size:12px;font-weight:700;margin:7px 1px 2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pcard .st{font-size:10px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pcard.more{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;height:149px;border-radius:14px;background:var(--well);box-shadow:var(--pressed);color:var(--textDim);font-size:11px;font-weight:700}
.pcard.more .ic{width:36px;height:36px;border-radius:50%;background:var(--surface);box-shadow:var(--raised-sm);display:grid;place-items:center}

/* 栅格 */
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px 10px;padding:2px 18px 16px}
.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:14px 12px;padding:2px 18px 16px}
.gcard .poster{position:relative;width:100%;aspect-ratio:3/4;border-radius:14px;overflow:hidden;background:linear-gradient(160deg,var(--c1),var(--c2));box-shadow:var(--raised-sm)}
.gcard .poster::after{content:'';position:absolute;inset:0;background:radial-gradient(72% 52% at 28% 16%,rgba(255,255,255,.26),transparent 62%),linear-gradient(to top,rgba(8,10,16,.7),transparent 52%)}
.gcard .rk{position:absolute;left:6px;top:6px;z-index:2;font-size:10px;font-weight:800;color:#fff;background:rgba(0,0,0,.42);padding:2px 6px;border-radius:6px}
.gcard .rk.top{background:var(--accent)}
.gcard .epb{position:absolute;right:6px;bottom:6px;z-index:2;font-size:9px;font-weight:700;color:#fff;background:rgba(0,0,0,.45);padding:2px 5px;border-radius:5px}
.gcard .pt{position:absolute;left:7px;right:7px;bottom:22px;z-index:2;color:#fff;font-size:10px;font-weight:700;line-height:1.3;text-shadow:0 1px 5px rgba(0,0,0,.6);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.gcard .prog{position:absolute;left:0;right:0;bottom:0;height:3px;background:rgba(255,255,255,.2);z-index:2}
.gcard .prog i{display:block;height:100%;background:var(--accent)}
.gcard .nm{font-size:12px;font-weight:700;margin:7px 1px 2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gcard .st{font-size:10px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* 分类筛选 */
.filterbar{display:flex;align-items:center;gap:8px;padding:0 16px 10px}
.filterbar .fbtn{height:36px;padding:0 14px;border-radius:999px;background:var(--surface);box-shadow:var(--raised-sm);font-size:12.5px;font-weight:700;color:var(--textDim);display:inline-flex;align-items:center;gap:6px;flex:none}
.filterbar .fbtn.on{box-shadow:var(--pressed),0 0 0 2px var(--focusRing);color:var(--text)}
.filterbar .sum{font-size:10.5px;color:var(--sub);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:right}

/* 搜索 */
.searchbar{display:flex;gap:8px;padding:0 16px 10px}
.searchbar .box{flex:1;height:42px;border-radius:999px;background:var(--well);box-shadow:var(--pressed);border:1px solid var(--outline);display:flex;align-items:center;gap:8px;padding:0 16px;color:var(--sub);font-size:13px}
.searchbar .box.on{border-color:var(--focus);box-shadow:var(--pressed),0 0 0 2px var(--focusRing)}
.searchbar .box input{flex:1;min-width:0;border:0;background:none;outline:none;color:var(--text);font-size:13.5px;font-family:inherit}
.searchbar .box input::placeholder{color:var(--sub)}
.srcline{padding:0 18px 8px;font-size:11px;color:var(--sub)}

/* 详情 */
.detail{padding:0 0 10px}
.dtop{display:flex;gap:14px;padding:2px 18px 12px}
.dposter{width:122px;height:174px;border-radius:16px;overflow:hidden;flex:none;background:linear-gradient(160deg,var(--c1),var(--c2));box-shadow:var(--raised);position:relative}
.dposter::after{content:'';position:absolute;inset:0;background:radial-gradient(70% 50% at 28% 14%,rgba(255,255,255,.28),transparent 60%)}
.dinfo{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px;padding-top:2px}
.dinfo h2{font-size:19px;font-weight:800;line-height:1.25;letter-spacing:-.4px}
.dinfo .m{font-size:10.5px;color:var(--sub)}
.dinfo .tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:1px}
.dinfo .tags span{font-size:9px;font-weight:700;color:var(--accent);background:rgba(91,141,239,.1);padding:2px 7px;border-radius:999px}
.dinfo .star{display:flex;align-items:baseline;gap:5px;margin-top:2px}
.dinfo .star b{font-size:16px;color:var(--accent);font-weight:800}
.dinfo .star span{font-size:9.5px;color:var(--sub)}
.dsyn{padding:0 18px 12px;font-size:12px;line-height:1.75;color:var(--textDim)}
.dsyn.clamp{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.dacts{display:flex;gap:7px;padding:0 16px 14px}
.dacts .btn{flex:1;padding:0 6px;font-size:12px;height:44px}
.dacts .btn svg{width:15px;height:15px}
.eps{padding:0 16px}
.ephead{display:flex;align-items:baseline;gap:8px;padding:2px 2px 9px}
.ephead h3{font-size:15.5px;font-weight:800}
.ephead span{font-size:10px;color:var(--sub)}
.ephead .r{margin-left:auto;font-size:9.5px;color:var(--sub)}
.epgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.epcell{height:40px;border-radius:12px;background:var(--surface);box-shadow:var(--raised-sm);display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--textDim);position:relative}
.epcell.cur{background:var(--lit);color:var(--onLit);box-shadow:0 0 0 2px var(--focusRing)}
.epcell:active{box-shadow:var(--pressed)}
.eppager{display:flex;align-items:center;justify-content:space-between;padding:10px 2px 0;font-size:10px;color:var(--sub)}
.pager{display:flex;gap:6px}
.pager i{width:6px;height:6px;border-radius:50%;background:var(--outline)}
.pager i.on{background:var(--accent)}
.relrow{display:flex;gap:10px;overflow-x:auto;padding:2px 18px 14px}
.rcard{flex:none;width:100px}
.rcard .poster{width:100px;height:133px}
.rcard .nm{font-size:11px}
.rcard .st{font-size:9px}

/* 播放器 */
.player{position:absolute;inset:0;background:#05070a;overflow:hidden;color:#fff}
.vwrap{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);aspect-ratio:16/9;background:linear-gradient(160deg,#2b1f2c,#4a2438 42%,#6b2f3c 66%,#0b0d12)}

/* ============================================================
   1. 主题令牌（对齐 TvTheme 的八个语义色 + 派生档位）
   ============================================================ */
function hexToRgb(h){const n=parseInt(h.slice(1),16);return [n>>16&255,n>>8&255,n&255]}
function mix(a,b,r){const A=hexToRgb(a),B=hexToRgb(b);return 'rgb('+A.map((v,i)=>Math.round(v+(B[i]-v)*r)).join(',')+')'}
function rgba(h,a){const A=hexToRgb(h);return `rgba(${A[0]},${A[1]},${A[2]},${a})`}
function themeVars(t){
  const surface=mix(t.base,t.light,.45),surfaceHigh=mix(t.base,t.light,.72);
  const well=mix(t.base,t.dark,.45),wellDeep=mix(t.base,t.dark,.72);
  const lit=t.isDark?mix(t.light,'#FFFFFF',.82):t.light;
  const onLit=t.isDark?'#15181C':mix(t.text,'#0B0D10',.42);
  return {
    '--base':t.base,'--surface':surface,'--surfaceHigh':surfaceHigh,'--well':well,'--wellDeep':wellDeep,
    '--text':t.text,'--sub':t.sub,'--textDim':mix(t.text,t.sub,.55),'--textStrong':rgba(t.text,.88),
    '--focus':t.focus,'--accent':t.accent,'--danger':t.danger,'--lit':lit,'--onLit':onLit,
    '--focusRing':rgba(t.focus,.85),'--litGlow':rgba(t.focus,.22),
    '--outline':rgba(t.text,.10),'--separator':rgba(t.text,.08),
    '--shDark':rgba(t.dark,t.isDark?.55:.55),'--shLight':rgba(t.light,t.isDark?.10:.95),
    '--inDark':rgba(t.dark,t.isDark?.55:.55),'--inLight':rgba(t.light,t.isDark?.10:.9)
  };
}
function applyTheme(id){
  const t=THEMES.find(x=>x.id===id)||THEMES[0];
  const v=themeVars(t);
  Object.entries(v).forEach(([k,val])=>document.documentElement.style.setProperty(k,val));
  document.documentElement.dataset.theme=t.id;
  state.theme=t.id;
  document.querySelectorAll('[data-theme-btn]').forEach(b=>b.classList.toggle('on',b.dataset.themeBtn===t.id));
  renderSpecs(t);
  if(currentView==='demo') render();
}
function renderSpecs(t){
  const v=themeVars(t);
  const items=[
    ['底板',t.base,'全站唯一材质'],
    ['凸起',v['--surface'],'卡片 / 按钮 / 芯片'],
    ['凹陷',v['--well'],'搜索框 / 输入框 / 选中'],
    ['焦点',t.focus,'2px 焦点环'],
    ['强调',t.accent,'进度 / 名次 / 选中文字'],
    ['圆角','20 / 14','卡片 20 · 海报 14']
  ];
  document.getElementById('specs').innerHTML=items.map(([k,c,d])=>`
    <div class="spec"><div class="sw" style="background:${c}"></div><div><b>${k} ${c}</b><span>${d}</span></div></div>`).join('');
}

function poster(s,opts={}){
  const badge=opts.badge!==undefined?opts.badge:(s.up>=s.eps?'全 '+s.eps:'更新 '+s.up);
  const label=opts.label||'';
  const progress=opts.progress;
  const resume=!!opts.resume;
  const rank=opts.rank;
  const cls=opts.card==='g'?'gcard':opts.card==='r'?'rcard':'pcard';
  return `<div class="${cls}" data-card="${s.id}" ${resume?`data-resume="1"`:''}>
    <div class="poster" style="--c1:${s.c1};--c2:${s.c2}">
      ${rank?`<span class="rk ${rank<=3?'top':''}">${rank}</span>`:''}
      ${badge?`<span class="epb">${badge}</span>`:''}
      <div class="pt">${s.t}</div>
      ${progress!=null?`<div class="prog"><i style="width:${progress}%"></i></div>`:''}
    </div>
    <div class="nm">${s.t}</div>
    <div class="st">${label||s.tags}</div>
  </div>`;
}
function shelf(title,items,opts={}){
  if(!items.length) return '';
  return `<section class="shelf">
    <div class="shelf-head"><h3>${title}</h3><span>${opts.sub||''}</span></div>
    <div class="shelf-row">${items.map((s,i)=>poster(s,{...opts,rank:opts.rank?i+1:null})).join('')}
      ${opts.more?`<div class="pcard more" data-more="${opts.more}"><div class="ic">${ic('chev',16)}</div>查看全部</div>`:''}
    </div>
  </section>`;
}

    </div>`).join('')}</div>`;
}

function toast(msg){
  const el=document.querySelector('[data-toast]');
  if(!el) return;
  el.textContent=msg;el.classList.add('show');
  clearTimeout(state.toastTimer);
  state.toastTimer=setTimeout(()=>el.classList.remove('show'),1700);
}

        <div style="flex:1;display:flex;flex-direction:column;gap:6px">${bar('84%',7,'#3A4553')}${bar('64%',5,'#8894A4')}${bar('74%',5,'#8894A4')}</div>
      </div></div>`;
    if(ov==='keypicker') return dim+sheet(`${[0,1,2,3,4,5].map(i=>`<i style="display:block;height:20px;border-radius:9px;background:${i===0?'rgba(255,255,255,.4)':'rgba(255,255,255,.18)'};margin-bottom:7px"></i>`).join('')}`,54);
    return dim+`<div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:0 26px">
      <div style="width:100%;border-radius:18px;background:#fff;padding:18px;display:flex;flex-direction:column;gap:8px">
        ${bar('60%',9,'#3A4553')}${bar('100%',6,'#8894A4')}${bar('90%',6,'#8894A4')}
        <div style="display:flex;gap:8px;margin-top:6px">${bar('50%',18,'#D5DDE7')}${bar('50%',18,'#3A4553')}</div>
      </div></div>`;
  })();
  return `<div style="width:${TH_W}px;height:${TH_H}px;background:${dark?'#0b0e12':'#E0E5EC'};position:relative;overflow:hidden">${body}${overlay}</div>`;
}

function frameHTML(item){
  const W=TH_W,H=TH_H,S=TH_S;
  const w=Math.round(W*S),h=Math.round(H*S);
  return `<div class="frame-box" data-open="${item.p}" data-opts='${JSON.stringify(item.o||{})}' data-ov="${item.ov||''}" data-ovo='${JSON.stringify(item.ovO||{})}'>
    <div class="scale" style="width:${w}px;height:${h}px">
      <div style="width:${W}px;height:${H}px;zoom:${S}">${miniThumb(item.p,item.o||{},item.ov||null)}</div>
    </div>
  </div>`;
}
function buildFlow(){
  const S=TH_S,W=Math.round(TH_W*S),H=Math.round(TH_H*S);
  const stages=FLOW.map(st=>`
    <section class="stage">
      <div class="stage-h"><div class="n">${st.n}</div><div><h3>${st.t}</h3><p>${st.d}</p></div></div>
      <div class="rail">${st.items.map((it,i)=>`
        <div class="slot" style="width:${W}px">
          ${frameHTML(it)}
          <div class="cap"><span class="sid">${it.s}</span><b>${it.n}</b><em>${it.e}</em></div>
        </div>
        ${i<st.items.length-1?`<div class="arrow" style="height:${H}px"><div class="ln"></div><span>${['点按','返回','确认','切换'][i%4]}</span></div>`:''}`).join('')}
      </div>
    </section>`).join('');
  return `<div class="flow">
    <div class="plat-head"><h2>手机版 · 竖屏</h2><span class="tag">ANDROID 392×856 · iOS 390×844</span>
      <span class="meta">同一套新拟态材质，两端各自保留系统外壳与导航语法</span></div>
    <div class="plat-note">底部五栏 <b>首页 / 分类 / 榜单 / 搜索 / 我的</b>，应用栏随页换标题；二级页（详情 / 播放 / 设置 / 集合页）不留底部栏，左上圆形返回。播放界面横屏内容竖屏呈现：16:9 画面居中，控制层贴底。</div>
    ${stages}
    <div class="diff">
      <h3>这一版改了什么</h3>
      <p class="d">材质与外壳沿用上一版手机原型；界面结构与交互按 <b>MainActivity*</b> / <b>ListPage</b> / <b>core</b> 重排。</p>
      <table>
        <tr><th>项</th><th>处理</th></tr>
        <tr><td>删掉</td><td>旧版里那套代码没有的模块、启动页、游客入口，以及上一轮误做的横屏电视版面</td></tr>
        <tr><td>补上</td><td>七栏首页、四体裁 + 七行筛选、四榜与来源行、热搜与历史、详情四按钮与 5 列选集、播放设置与选集浮层、登录卡与四栏、四组设置、20 套主题、卡片菜单、备份二维码、清空确认、版本更新、播完推荐</td></tr>
        <tr><td>修顺</td><td>首页剧架不再混入底部 Tab 的层级；分类筛选改为「入口 + 底部弹层」；详情按钮四等分不再换行；选集按竖屏 5 列重排；播放器不再用横屏版面</td></tr>
      </table>
    </div>
  </div>`;
}

/* ============================================================
   8. 演示视图
   ============================================================ */
const NAV=[
  ['home','首页 H1'],['category','分类 C1'],['rank','榜单 R1'],['search','搜索 S1'],
  ['detail','详情 D1'],['player','播放 P1'],['profile','我的 M1'],['settings','设置 T1'],
  ['collection','我的收藏 H2']
];
function demoMarkup(){
  const page=state.page;
  const hint=HINTS[page]||'';
  const th=THEMES.find(t=>t.id===state.theme);
  return `<div class="demo">
    <aside class="side"><div class="side-card">
      <h4>PLATFORM</h4>
      <div class="plat-seg">
        <button data-plat="android" class="${state.platform==='android'?'on':''}">Android</button>
        <button data-plat="ios" class="${state.platform==='ios'?'on':''}">iOS</button>
      </div>
      <h4>PAGES</h4>
      <div class="nav-list">${NAV.map(([k,l])=>`<button data-jump="${k}" class="${page===k?'on':''}">${l}<i>›</i></button>`).join('')}</div>
      <h4>OVERLAYS</h4>
      <div class="nav-list">
        <button data-ov="cardmenu">卡片菜单 X1<i>›</i></button>
        <button data-ov="backup">备份二维码 X2<i>›</i></button>
        <button data-ov="confirm">清空确认 X3<i>›</i></button>
        <button data-ov="update">版本更新 X4<i>›</i></button>
        <button data-ov="history">搜索历史<i>›</i></button>
        <button data-ov="keypicker">按键选择<i>›</i></button>
        <button data-ov="filter">筛选弹层<i>›</i></button>
      </div>
      <h4>THEME</h4>
      <div style="display:flex;flex-wrap:wrap;gap:6px">
        ${THEMES.map(t=>`<button data-theme-pick="${t.id}" title="${t.label}" style="width:21px;height:21px;border-radius:6px;background:${t.base};box-shadow:inset 0 0 0 1px rgba(255,255,255,.16)${t.id===state.theme?',0 0 0 2px var(--focusRing)':''}"></button>`).join('')}
      </div>
    </div></aside>
    <div class="stage-dev">
      <div class="dev-hold" data-dev>${screenHTML(page,state.opts,state.overlay,state.overlayOpts)}</div>
      <div class="dev-hint">点屏幕里的任意控件进入下一层 · <b>Esc</b> 返回 · 左侧可切平台 / 主题</div>
    </div>
    <aside class="side"><div class="side-card">
      <div class="note-h"><h3>${PAGE_NAMES[page]||page}</h3><span class="st">${(state.overlay||page).toUpperCase()}</span></div>
      <div class="note-sub">${hint}</div>
      <div class="note-sec">布局</div>
      <div class="kv2"><b>画布</b>Android 392×856 · iOS 390×844；底部五栏 76 / 66</div>
      <div class="kv2"><b>间距</b>内容线 16 / 18；卡片 20 圆角；海报 14</div>
      <div class="kv2"><b>选集</b>竖屏 5 列，一页 20 集，左右翻页</div>
      <div class="note-sec">状态</div>
      <div class="kv2"><b>主题</b>${th.label}</div>
      <div class="kv2"><b>账号</b>${state.opts.logged===true?'已登录':'未登录'} · 本机记录与账号侧是两套</div>
      <div class="note-sec">交互</div>
      <div class="kv2">返回键逐层退出：弹层 → 二级页 → 首页；播放界面返回直接回详情。</div>
    </div></aside>
  </div>`;
}

/* ============================================================
   9. 渲染与交互
   ============================================================ */
let currentView='flow';
function render(){
  const app=document.getElementById('app');
  app.innerHTML=currentView==='flow'?buildFlow():demoMarkup();
  bind();
}
function go(page,opts={}){
  if(state.page!==page) state.stack.push({page:state.page,opts:state.opts});
  state.page=page; state.opts=opts||{}; state.overlay=null; state.overlayOpts={};
  render();
}
function back(){
  const prev=state.stack.pop();
  if(prev){state.page=prev.page;state.opts=prev.opts;state.overlay=null;state.overlayOpts={};render();}
  else go('home');
}
function openOverlay(kind,opts={}){state.overlay=kind;state.overlayOpts=opts;render();}
function closeOverlay(){state.overlay=null;state.overlayOpts={};render();}

function bind(){
  document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{
    currentView=b.dataset.view;
    document.querySelectorAll('[data-view]').forEach(x=>x.classList.toggle('on',x===b));
    render();
  });
  document.querySelectorAll('[data-theme-btn]').forEach(b=>b.onclick=()=>applyTheme(b.dataset.themeBtn));
  document.querySelectorAll('[data-theme-pick]').forEach(b=>b.onclick=()=>applyTheme(b.dataset.themePick));
  document.querySelectorAll('[data-plat]').forEach(b=>b.onclick=()=>{state.platform=b.dataset.plat;render();});
  document.querySelectorAll('[data-open]').forEach(el=>el.onclick=()=>{
    state.page=el.dataset.open;
    state.opts=JSON.parse(el.dataset.opts||'{}');
    state.overlay=el.dataset.ov||null;
    state.overlayOpts=JSON.parse(el.dataset.ovo||'{}');
    state.stack=[];
    currentView='demo';
    document.querySelectorAll('[data-view]').forEach(x=>x.classList.toggle('on',x.dataset.view==='demo'));
    render();
  });
  document.querySelectorAll('[data-jump]').forEach(b=>b.onclick=()=>{
    const k=b.dataset.jump;
    if(k==='collection') go('collection',{kind:'favorites'});
    else if(k==='profile') go('profile',{logged:state.opts.logged===true});
    else go(k);
  });
  document.querySelectorAll('[data-ov]:not(.frame-box)').forEach(b=>b.onclick=()=>{
    const k=b.dataset.ov;
    if(k==='cardmenu') openOverlay('cardmenu',{series:SERIES[0],history:true,hot:true});
    else if(k==='confirm') openOverlay('confirm',{title:'清空应用缓存',body:'清空后应用会重新注册设备、重新生成标识。\n\n注意：本机的收藏、观看记录、搜索历史与设置也会一并清空，且无法找回。',ok:'清空',danger:true});
    else if(k==='backup') openOverlay('backup');
    else if(k==='update') openOverlay('update');
    else if(k==='history') openOverlay('history');
    else if(k==='keypicker') openOverlay('keypicker',{key:'上键'});
    else if(k==='filter') openOverlay('filter',{title:'主题'});
  });
  const root=document.getElementById('app');
  root.querySelectorAll('[data-go]').forEach(el=>el.onclick=e=>{e.stopPropagation();go(el.dataset.go);});
  root.querySelectorAll('[data-back]').forEach(el=>el.onclick=e=>{e.stopPropagation();back();});
  root.querySelectorAll('[data-card]').forEach(el=>el.onclick=e=>{
    e.stopPropagation();
    if(state.overlay) closeOverlay();
    if(el.dataset.resume) go('player',{id:el.dataset.card,ep:11});
    else go('detail',{id:el.dataset.card});
  });
  root.querySelectorAll('[data-more]').forEach(el=>el.onclick=e=>{
    e.stopPropagation();
    const v=el.dataset.more;
    if(v.startsWith('rank-')) go('rank',{board:RANK_BOARDS.find(b=>b.key===v.slice(5))});
    else go('collection',{kind:v});
  });
  root.querySelectorAll('[data-genre]').forEach(el=>el.onclick=e=>{e.stopPropagation();go('category',{genre:el.dataset.genre});});
  root.querySelectorAll('[data-board]').forEach(el=>el.onclick=e=>{e.stopPropagation();go('rank',{board:RANK_BOARDS.find(b=>b.key===el.dataset.board)});});
  root.querySelectorAll('[data-atab]').forEach(el=>el.onclick=e=>{e.stopPropagation();go('profile',{logged:true,tab:el.dataset.atab});});
  root.querySelectorAll('[data-suggest]').forEach(el=>el.onclick=e=>{e.stopPropagation();closeOverlay();go('search',{q:el.dataset.suggest});});
  root.querySelectorAll('[data-filter]').forEach(el=>el.onclick=e=>{e.stopPropagation();openOverlay('filter',{title:el.dataset.filter});});
  root.querySelectorAll('[data-pickfilter]').forEach(el=>el.onclick=e=>{
    e.stopPropagation();
    const [k,v]=el.dataset.pickfilter.split(':');
    state.opts={...state.opts,sel:{...(state.opts.sel||{}),[k]:v==='全部'?null:v}};
    closeOverlay();
  });
  root.querySelectorAll('[data-ep]').forEach(el=>el.onclick=e=>{
    e.stopPropagation();
    if(state.page==='player'){
      state.opts={...state.opts,ep:+el.dataset.ep,mode:'',hud:true};render();toast('已切到第 '+(+el.dataset.ep+1)+' 集');
    } else go('player',{id:state.opts.id||'d1',ep:+el.dataset.ep});
  });
  root.querySelectorAll('[data-act]').forEach(el=>el.onclick=e=>{
    e.stopPropagation();
    const a=el.dataset.act;
    if(a==='close-overlay') closeOverlay();
    else if(a==='toggle') toast('播放 / 暂停');
    else if(a==='episodes'){state.opts={...state.opts,mode:'episodes',hud:false};render();}
    else if(a==='close-layer'){state.opts={...state.opts,mode:'',hud:true};render();}
    else if(a==='play') go('player',{id:state.opts.id||'d1',ep:state.opts.ep||0});
    else if(a==='resume'){closeOverlay();go('player',{id:state.opts.id||'d1',ep:11});}
    else if(a==='fav') toast('已收藏 · 同步到账号');
    else if(a==='synopsis'){state.opts={...state.opts,expanded:!state.opts.expanded};render();}
    else if(a==='related'){state.opts={...state.opts,related:!state.opts.related};render();}
    else if(a==='login'){state.opts={logged:true,tab:'history'};render();toast('登录成功');}
    else if(a==='logout'){state.opts={logged:false};render();}
    else if(a==='refresh') toast('正在刷新账号信息…');
    else if(a==='send-code') toast('验证码已发送，60 秒后可重发');
    else if(a==='history') openOverlay('history');
    else if(a==='backup') openOverlay('backup');
    else if(a==='reset') openOverlay('confirm',{title:'清空应用缓存',body:'清空后应用会重新注册设备、重新生成标识。\n\n注意：本机的收藏、观看记录、搜索历史与设置也会一并清空，且无法找回。',ok:'清空',danger:true});
    else if(a==='keypicker') openOverlay('keypicker',{key:'上键'});
    else if(a==='do-search'){const v=root.querySelector('.searchbar input');go('search',{q:(v&&v.value)||'总裁'});}
    else if(a==='confirm-ok'){closeOverlay();toast('已执行');}
  });
  root.querySelectorAll('.mask[data-act="close-overlay"]').forEach(el=>el.onclick=e=>{if(e.target===el) closeOverlay();});
}
document.addEventListener('keydown',e=>{
  if(currentView!=='demo') return;
  if(e.key==='Escape'){ if(state.overlay) closeOverlay(); else back(); }
});
applyTheme(state.theme);
render();
</script>
</body>
</html>
